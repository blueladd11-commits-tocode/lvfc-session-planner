# Publishes app/ to GitHub Pages on every push to main.
# Enable once under Settings -> Pages -> Source: GitHub Actions.
name: Deploy planner

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Stamp asset URLs with the commit SHA. Without this a coach's browser
      # keeps serving a cached planner.js and never sees an update.
      - name: Cache-bust assets
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" app/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
